<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ada AI Mascot" width="256" height="256">
<title>AI Engineer Mascot</title>
<desc>Animated flat illustration of a friendly female software engineer with shoulder-length curly hair</desc>
<defs>
