    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes bubbleFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
    @keyframes waveMark{0%,100%{opacity:0;transform:translateX(0)}20%,80%{opacity:1}50%{transform:translateX(5px)}}
    @keyframes nodePulse{0%,100%{opacity:0.2}50%{opacity:0.8}}
